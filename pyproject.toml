[project]
name = "conveyor-monitoring"
version = "0.1.0"
description = "Conveyor monitoring system"
authors = [
    {name = "Ivan Shishkin",email = "shishkin.ie@mail.ru"}
]
requires-python = "^3.12"
dependencies = [
    "fastapi[all] (>=0.141.1,<0.142.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
